# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string
      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-14
    permissions:
      contents: write
    env:
      MINIMUM_IOS_VERSION: "17.5"

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      # YTweaks and YouPiP are intentionally built from their configured
      # upstream branches. The super-project gitlink is only a bootstrap
      # revision; using --remote here prevents the build from silently
      # reverting to that pinned revision. The local compatibility changes
      # are then applied by the root Makefile from Patches/.
      - name: Use current YTweaks and YouPiP sources
        run: |
          cd "${{ github.workspace }}/main"
          git submodule update --init --remote Tweaks/YTweaks Tweaks/YouPiP

      - name: Test Caption Island
        run: |
          cd ${{ github.workspace }}/main
          swift test --package-path Tweaks/CaptionIslandTests
          smoke_dir="$(mktemp -d)"
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation \
            Tweaks/CaptionIslandTests/ObjC/YouTubeInspectorSmoke.m \
            Tweaks/CaptionIsland/CIYouTubeInspector.m \
            Tweaks/CaptionIsland/CIModels.m \
            Tweaks/CaptionIsland/CITextUtilities.m \
            -o "$smoke_dir/YouTubeInspectorSmoke"
          "$smoke_dir/YouTubeInspectorSmoke"
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation \
            Tweaks/CaptionIslandTests/ObjC/LRCLIBProviderSmoke.m \
            Tweaks/CaptionIsland/CILRCLIBProvider.m \
            Tweaks/CaptionIsland/CICaptionParser.m \
            Tweaks/CaptionIsland/CIModels.m \
            Tweaks/CaptionIsland/CITextUtilities.m \
            -o "$smoke_dir/LRCLIBProviderSmoke"
          "$smoke_dir/LRCLIBProviderSmoke"
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation \
            Tweaks/CaptionIslandTests/ObjC/VideoEligibilitySmoke.m \
            Tweaks/CaptionIsland/CIVideoEligibility.m \
            -o "$smoke_dir/VideoEligibilitySmoke"
          "$smoke_dir/VideoEligibilitySmoke"
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation \
            Tweaks/CaptionIslandTests/ObjC/VideoOverridesSmoke.m \
            Tweaks/CaptionIsland/CIVideoOverrides.m \
            Tweaks/CaptionIsland/CITextUtilities.m \
            -o "$smoke_dir/VideoOverridesSmoke"
          "$smoke_dir/VideoOverridesSmoke"
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation \
            Tweaks/CaptionIslandTests/ObjC/ConfigurationSmoke.m \
            Tweaks/CaptionIsland/CIConstants.m \
            Tweaks/CaptionIsland/CILogStore.m \
            -o "$smoke_dir/ConfigurationSmoke"
          "$smoke_dir/ConfigurationSmoke"
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework Foundation \
            Tweaks/CaptionIslandTests/ObjC/CaptionTimingSmoke.m \
            Tweaks/CaptionIsland/CICaptionTiming.m \
            -o "$smoke_dir/CaptionTimingSmoke"
          "$smoke_dir/CaptionTimingSmoke"

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

      - name: Setup Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive
      
      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4.3.0
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v5
        with:
          repository: qnblackcat/theos-jailed
          ref: 662fd704aed27b8956bcfe52a35e2b676921ab42
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV

      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          wget "$YOUTUBE_URL" --quiet --no-verbose -O main/YouTube.ipa
          cd ${{ github.workspace }}/main
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "==> YouTube v$youtube_version downloaded!"
          plutil -replace NSSupportsLiveActivities -bool YES "Payload/YouTube.app/Info.plist" 2>/dev/null || \
            plutil -insert NSSupportsLiveActivities -bool YES "Payload/YouTube.app/Info.plist"
          plutil -replace MinimumOSVersion -string "$MINIMUM_IOS_VERSION" "Payload/YouTube.app/Info.plist" 2>/dev/null || \
            plutil -insert MinimumOSVersion -string "$MINIMUM_IOS_VERSION" "Payload/YouTube.app/Info.plist"
          if ! /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "Payload/YouTube.app/Info.plist" 2>/dev/null | grep -qw audio; then
            /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' "Payload/YouTube.app/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes: string audio' "Payload/YouTube.app/Info.plist"
          fi
          echo "youtube_version=${youtube_version}" >> $GITHUB_OUTPUT

        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ env.URL_YT }}

      - name: Fix compiling & Build Package
        id: build_package
        run: |
          cd ${{ github.workspace }}/main
          make package \
            TARGET="iphone:clang:${SDK_VERSION}:${MINIMUM_IOS_VERSION}" \
            SDK_VERSION="${SDK_VERSION}" \
            HOST_DEPLOYMENT_VERSION="${MINIMUM_IOS_VERSION}" \
            YOUTUBE_VERSION="${YOUTUBE_VERSION}" \
            UYOU_VERSION="${UYOU_VERSION}" \
            BUNDLE_ID="${BUNDLE_ID}" \
            DISPLAY_NAME="${APP_NAME}" \
            THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1
          echo "package=$(ls -t packages | head -n1)" >>$GITHUB_OUTPUT
          echo -e "==> \033[1mSHASUM256: $(shasum -a 256 packages/*.ipa | cut -f1 -d' ')\033[0m"
          echo -e "==> \033[1mBundle ID: ${{ env.BUNDLE_ID }}\033[0m"

        env:
          THEOS: ${{ github.workspace }}/theos
          SDK_VERSION: ${{ inputs.sdk_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
          UYOU_VERSION: ${{ inputs.uyou_version }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}

      - name: Verify Caption Island IPA
        env:
          PACKAGE_NAME: ${{ steps.build_package.outputs.package }}
        run: |
          cd ${{ github.workspace }}/main
          verify_dir="$(mktemp -d)"
          unzip -q "packages/${PACKAGE_NAME}" -d "$verify_dir"
          app_path="$(find "$verify_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          test "$(plutil -extract NSSupportsLiveActivities raw -expect bool -o - "$app_path/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist")" = "$MINIMUM_IOS_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app_path/Info.plist" | grep -qw audio
          test -f "$app_path/Frameworks/CaptionIsland.dylib"
          caption_minos="$(otool -l "$app_path/Frameworks/CaptionIsland.dylib" | awk '$1 == "minos" { print $2; exit }')"
          test "$caption_minos" = "$MINIMUM_IOS_VERSION"
          widget_path="$app_path/PlugIns/CaptionIslandWidget.appex"
          test -x "$widget_path/CaptionIslandWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$widget_path/Info.plist")" = "com.apple.widgetkit-extension"
          host_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers' "$app_path/Info.plist" | \
            grep -Fq "${host_id}.captionisland.background-captions.*"
          widget_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_path/Info.plist")"
          test "$widget_id" = "${host_id}.CaptionIslandWidget"
          lipo -archs "$widget_path/CaptionIslandWidget" | grep -qw arm64
          widget_minos="$(otool -l "$widget_path/CaptionIslandWidget" | awk '$1 == "minos" { print $2; exit }')"
          test "$widget_minos" = "$MINIMUM_IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$widget_path/Info.plist")" = "$MINIMUM_IOS_VERSION"
          test "$(plutil -extract NSSupportsLiveActivities raw -expect bool -o - "$widget_path/Info.plist")" = "true"
          for extension_plist in "$app_path"/PlugIns/*.appex/Info.plist; do
            extension_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension_plist")"
            case "$extension_id" in
              "${host_id}."*) ;;
              *) echo "Invalid extension bundle ID: $extension_id"; exit 1 ;;
            esac
            test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$extension_plist")" = "$MINIMUM_IOS_VERSION"
          done
          echo "==> CaptionIsland and native Live Activity extension verified"

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v5
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: uYouEnhanced_${{ env.YOUTUBE_VERSION }}_${{ env.UYOU_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
          name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
          files: main/packages/*.ipa
          draft: true
